<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Engineers of the Elite · a 3D campus life game</title>
    <meta
      name="description"
      content="Survive eight semesters at a 3D engineering university: pick your department, attend real classrooms, join clubs, make friends and beat the finals. Plays in your browser."
    />
    <meta name="theme-color" content="#1b2142" />
    <meta property="og:title" content="Engineers of the Elite" />
    <meta
      property="og:description"
      content="A 3D engineering university game: five departments, lectures in real classrooms, midterms, clubs, friends from every year and finals boss fights."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%99%EF%B8%8F%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="labels"></div>
    <div id="hud" class="hidden"></div>
    <div id="screens"></div>
    <div id="dialog"></div>
    <div id="banner" style="display: none"></div>
    <div id="toasts"></div>
    <div id="touch">
      <div id="joy"><i></i></div>
      <button id="tact" aria-label="Interact">E</button>
    </div>
    <div id="fade"></div>
    <canvas id="fx"></canvas>
    <noscript>
      <div class="fatal">Please enable JavaScript to play Engineers of the Elite.</div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
