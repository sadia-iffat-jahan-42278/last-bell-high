<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Last Bell University · a 3D campus life game</title>
    <meta
      name="description"
      content="Survive four years and eight semesters at a 3D university: real classrooms, midterms, club activities, friends in every year and finals boss fights. Plays in your browser."
    />
    <meta name="theme-color" content="#1b2142" />
    <meta property="og:title" content="Last Bell University" />
    <meta
      property="og:description"
      content="A 3D university life game: lectures in real classrooms, midterms, clubs, friends from every year and finals boss fights. Play in your browser."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%94%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="labels"></div>
    <div id="hud" class="hidden"></div>
    <div id="screens"></div>
    <div id="dialog"></div>
    <div id="banner" style="display: none"></div>
    <div id="toasts"></div>
    <div id="touch">
      <div id="joy"><i></i></div>
      <button id="tact" aria-label="Interact">E</button>
    </div>
    <div id="fade"></div>
    <canvas id="fx"></canvas>
    <noscript>
      <div class="fatal">Please enable JavaScript to play Last Bell University.</div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
